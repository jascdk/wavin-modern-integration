name: wavin-modern-integration

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      MQTT_URL: ${MQTT_URL:-mqtt://localhost:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-wavin-modern-backend}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-wavin}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this in at build time. When accessing the UI from another
        # machine, point it at the host's reachable address, e.g.:
        #   VITE_API_BASE_URL=http://<lxc-ip>:3001
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
